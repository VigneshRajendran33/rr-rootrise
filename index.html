    />

    <meta

    />

    <meta

      content="index, follow"
    />

    <meta

      content="#04111f"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <link
      rel="canonical"
      href="https://rrrootrise.netlify.app"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/images/logo-symbol.png"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="RR RootRise Digital Innovations"
    />

    <meta
      property="og:title"
      content="RR RootRise Digital Innovations | Software & Digital Solutions"
    />

    <meta
      property="og:description"
      content="Professional websites, mobile applications, e-commerce platforms, custom web solutions, design and digital growth services for modern businesses."
    />

    <meta
      property="og:url"
      content="https://rrrootrise.netlify.app"
    />

    <meta
      property="og:image"
      content="https://rrrootrise.netlify.app/images/social-preview.jpg"
    />

    <meta
      property="og:image:alt"
      content="RR RootRise Digital Innovations"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="RR RootRise Digital Innovations | Software & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="Professional software and digital solutions built around real business goals."
    />

    <meta
      name="twitter:image"
      content="https://rrrootrise.netlify.app/images/social-preview.jpg"
    />
  </head>

  <body>
    <noscript>
      RR RootRise Digital Innovations requires
      JavaScript to display this website correctly.
    </noscript>

    <!--
      Hidden static form used by Netlify to detect
      the React project enquiry form during deployment.
    -->
    <form
      name="rr-rootrise-project-enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="botField"
      hidden
    >
      <input
        type="hidden"
        name="form-name"
        value="rr-rootrise-project-enquiry"
      />

      <input
        type="text"
        name="botField"
      />

      <input
        type="text"
        name="fullName"
      />

      <input
        type="text"
        name="businessName"
      />

      <input
        type="email"
        name="email"
      />

      <input
        type="tel"
        name="whatsappNumber"
      />

      <select name="service">
        <option value="">
          Select a service
        </option>
      </select>

      <textarea name="projectDetails"></textarea>
    </form>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
